version: '3.8'

services:
  kal-ontha:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: kal-ontha-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=kal_ontha_production_secret_change_me_in_prod
    volumes:
      - ../backend/kal_ontha.db:/app/backend/kal_ontha.db
      - ../backend/storage/pages:/app/backend/storage/pages
