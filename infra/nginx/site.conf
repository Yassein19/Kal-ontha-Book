# Nginx Configuration for Kal Ontha (كأنثى)
# Reverse Proxy & Static Edge Serving

server {
    listen 80;
    server_name kal-ontha.com www.kal-ontha.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kal-ontha.com www.kal-ontha.com;

    # SSL Certificates (e.g. Let's Encrypt / Cloudflare Origin Cert)
    ssl_certificate /etc/letsencrypt/live/kal-ontha.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kal-ontha.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Frontend Static Build (Cloudflare Pages or Local Nginx)
    root /var/www/kal-ontha/frontend/dist;
    index index.html;

    # Public static assets caching (1 year for hashed Vite chunks)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API Endpoints -> Node.js Express Backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Disable buffering for page streaming
        proxy_buffering off;
    }

    # Reader Streaming Route (Strict Anti-Cache)
    location /api/reader/stream/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_buffering off;
        add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # SPA Fallback for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
