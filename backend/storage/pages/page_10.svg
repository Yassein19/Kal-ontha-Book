      <rect width="100%" height="100%" fill="#FCF9F5" />
      <rect x="25" y="25" width="750" height="1080" rx="6" fill="none" stroke="#EFE8DD" stroke-width="1"/>
      
        <text x="400" y="240" font-family="'Cairo', sans-serif" font-size="32" fill="#221C18" text-anchor="middle" font-weight="bold">كلمة الختام</text>
        <path d="M 340 270 L 460 270" stroke="#C5A880" stroke-width="1.5"/>

        <text x="400" y="420" font-family="'Amiri', serif" font-size="24" fill="#2E2823" text-anchor="middle">تذكري دائمًا: النور الذي تبحثين عنه في الخارج، قد وُضع </text>
        <text x="400" y="465" font-family="'Amiri', serif" font-size="24" fill="#2E2823" text-anchor="middle">في قلبكِ منذ البداية.. فعيشي منه، وتنوري به، واتركي أثرًا لا يمحوه الزمان.</text>

        <text x="400" y="580" font-family="'Amiri', serif" font-size="28" fill="#C5A880" text-anchor="middle" font-weight="bold">بدور لطفي</text>

