<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="800" height="1130">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18151D"/>
      <stop offset="50%" stop-color="#241B28"/>
      <stop offset="100%" stop-color="#141118"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&amp;family=Cairo:wght@300;400;600;700;900&amp;display=swap');
      text { direction: rtl; unicode-bidi: embed; }
    </style>
  </defs>
  
      <rect width="100%" height="100%" fill="#FCF9F5" />
      <rect x="25" y="25" width="750" height="1080" rx="6" fill="none" stroke="#EFE8DD" stroke-width="1"/>
      
        <!-- Running Header -->
        <text x="700" y="90" font-family="'Cairo', sans-serif" font-size="14" fill="#998F82" text-anchor="end">الفصل الأول</text>
        <text x="100" y="90" font-family="'Cairo', sans-serif" font-size="14" fill="#998F82" text-anchor="start">كأنثى — بدور لطفي</text>
        <path d="M 90 110 L 710 110" stroke="#EBE4D8" stroke-width="1"/>

        <!-- Chapter Heading -->
        <text x="400" y="190" font-family="'Cairo', sans-serif" font-size="28" fill="#211C18" text-anchor="middle" font-weight="bold">صوت المشاعر: بوصلتكِ الأولى</text>
        <circle cx="400" cy="225" r="3" fill="#C5A880"/>

        <!-- Paragraphs -->
        <g transform="translate(100, 290)">
          
              <text x="600" y="0" font-family="'Amiri', serif" font-size="22" fill="#2C2722" text-anchor="end" line-height="2">المشاعر ليست أعداء نحاربهم، ولا عيوبًا نخفيها خلف قناع القوة</text>
              <text x="600" y="40" font-family="'Amiri', serif" font-size="22" fill="#2C2722" text-anchor="end" line-height="2"> الزائفة. المشاعر هي رسائل مشفرة قادمة من أعماق روحك لتخبركِ بحقي</text>
              <text x="600" y="80" font-family="'Amiri', serif" font-size="22" fill="#2C2722" text-anchor="end" line-height="2">قة ما تمرين به.</text>
            
              <text x="600" y="160" font-family="'Amiri', serif" font-size="22" fill="#2C2722" text-anchor="end" line-height="2">حين تشعرين بالحزن، فالروح تقول لكِ: هنا شيء عزيز يحتاج رعاية</text>
              <text x="600" y="200" font-family="'Amiri', serif" font-size="22" fill="#2C2722" text-anchor="end" line-height="2"> واعترافًا.</text>
              <text x="600" y="240" font-family="'Amiri', serif" font-size="22" fill="#2C2722" text-anchor="end" line-height="2"></text>
            
              <text x="600" y="320" font-family="'Amiri', serif" font-size="22" fill="#2C2722" text-anchor="end" line-height="2">وحين تشعرين بالغضب، فالجسد يخبركِ: هناك حدٌّ من حدودكِ قد تم</text>
              <text x="600" y="360" font-family="'Amiri', serif" font-size="22" fill="#2C2722" text-anchor="end" line-height="2"> تجاوزه، وانتبهي لحمايته.</text>
              <text x="600" y="400" font-family="'Amiri', serif" font-size="22" fill="#2C2722" text-anchor="end" line-height="2"></text>
            
              <text x="600" y="480" font-family="'Amiri', serif" font-size="22" fill="#2C2722" text-anchor="end" line-height="2">الوعي الذاتي يبدأ باللحظة التي تتوقفين فيها عن كبت مشاعركِ، </text>
              <text x="600" y="520" font-family="'Amiri', serif" font-size="22" fill="#2C2722" text-anchor="end" line-height="2">وتبدأين في الاستماع إليها كصديقة ناصحة.</text>
              <text x="600" y="560" font-family="'Amiri', serif" font-size="22" fill="#2C2722" text-anchor="end" line-height="2"></text>
            
        </g>
      
      
      <!-- Footer Page Number -->
      <path d="M 90 1040 L 710 1040" stroke="#EBE4D8" stroke-width="1"/>
      <text x="400" y="1075" font-family="'Cairo', sans-serif" font-size="16" fill="#756B5F" text-anchor="middle" font-weight="600">5</text>
    
</svg>